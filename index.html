<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Tank Düellosu - 2 Kişilik</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at 50% 30%, #1a1f2b 0%, #0a0c12 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; font-family: 'Segoe UI', Arial, sans-serif; color:#e8ecf1;
    overflow:hidden;
  }
  h1 {
    letter-spacing: 4px; font-size: 26px; margin-bottom: 10px;
    color:#ffcf5c; text-shadow: 0 0 14px rgba(255,207,92,0.5);
  }
  #hud {
    display:flex; justify-content:space-between; width:900px; margin-bottom:8px;
    font-size:14px;
  }
  .player-hud { width:45%; }
  .p1 { color:#5cd6ff; text-align:left; }
  .p2 { color:#ff6b6b; text-align:right; }
  .bar-bg {
    width:100%; height:14px; background:#222833; border-radius:8px;
    border:1px solid #333c4d; overflow:hidden; margin-top:4px;
  }
  .bar-fill { height:100%; transition: width 0.15s; }
  .p1 .bar-fill { background: linear-gradient(90deg,#2196f3,#5cd6ff); }
  .p2 .bar-fill { background: linear-gradient(90deg,#e53935,#ff6b6b); }
  canvas {
    background:#12161f;
    border:2px solid #333c4d;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  #info {
    margin-top:10px; font-size:12px; color:#8a94a6; text-align:center; line-height:1.6;
  }
  #msg {
    position:absolute; top:45%; font-size:42px; font-weight:bold;
    text-shadow: 0 0 20px rgba(0,0,0,0.8); display:none;
    background: rgba(10,12,18,0.85); padding: 20px 40px; border-radius: 14px;
    border: 1px solid #333c4d;
  }
  #restart {
    margin-top:16px; padding:10px 22px; font-size:14px; cursor:pointer;
    background:#ffcf5c; color:#1a1f2b; border:none; border-radius:8px; font-weight:bold;
    display:none;
  }
  #restart:hover { background:#ffe08a; }
  #overlay { position:absolute; display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>

<h1>⚔️ TANK DÜELLOSU ⚔️</h1>

<div id="hud">
  <div class="player-hud p1">
    OYUNCU 1 (Mavi)
    <div class="bar-bg"><div class="bar-fill" id="hp1" style="width:100%"></div></div>
  </div>
  <div class="player-hud p2">
    OYUNCU 2 (Kırmızı)
    <div class="bar-bg"><div class="bar-fill" id="hp2" style="width:100%"></div></div>
  </div>
</div>

<canvas id="game" width="900" height="560"></canvas>

<div id="overlay">
  <div id="msg"></div>
  <button id="restart">Tekrar Oyna</button>
</div>

<div id="info">
  Oyuncu 1: W A S D hareket · Boşluk çubuğuna yakın <b>F</b> ile ateş<br>
  Oyuncu 2: ← ↑ → ↓ ok tuşları ile hareket · <b>Enter / Numpad0</b> ile ateş
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ===== SES MOTORU (Web Audio API - dosya gerekmez) =====
const actx = new (window.AudioContext || window.webkitAudioContext)();
function unlockAudio(){
  if(actx.state === "suspended") actx.resume();
  window.removeEventListener('keydown', unlockAudio);
  window.removeEventListener('click', unlockAudio);
}
window.addEventListener('keydown', unlockAudio);
window.addEventListener('click', unlockAudio);

function playTone(freq, duration, type='square', volume=0.15, glideTo=null){
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, actx.currentTime);
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, actx.currentTime + duration);
  gain.gain.setValueAtTime(volume, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
  osc.connect(gain).connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + duration);
}
function playNoise(duration, volume=0.2){
  const bufferSize = actx.sampleRate * duration;
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
  const noise = actx.createBufferSource();
  noise.buffer = buffer;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(volume, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
  noise.connect(gain).connect(actx.destination);
  noise.start();
}
const sfx = {
  fire: () => playTone(320, 0.12, 'square', 0.12, 120),
  wallHit: () => playTone(180, 0.08, 'triangle', 0.1, 90),
  tankHit: () => { playNoise(0.25, 0.25); playTone(90, 0.2, 'sawtooth', 0.15, 40); },
  win: () => { [523,659,784,1046].forEach((f,i)=> setTimeout(()=>playTone(f,0.3,'square',0.15),i*130)); }
};

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.code] = false);

// Duvarlar (engeller)
const walls = [
  {x:400, y:0, w:20, h:200},
  {x:400, y:360, w:20, h:200},
  {x:180, y:250, w:140, h:20},
  {x:580, y:290, w:140, h:20},
  {x:80, y:80, w:20, h:120},
  {x:800, y:360, w:20, h:120},
];

function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

class Tank {
  constructor(x,y,color,angle, controls){
    this.x=x; this.y=y; this.angle=angle; this.color=color;
    this.size=22; this.speed=2.6; this.turnSpeed=0.055;
    this.hp=100; this.controls=controls;
    this.cooldown=0;
    this.alive=true;
  }
  rectBox(nx,ny){
    return {x:(nx??this.x)-this.size/2, y:(ny??this.y)-this.size/2, w:this.size, h:this.size};
  }
  update(bullets, other){
    if(!this.alive) return;
    if(this.cooldown>0) this.cooldown--;

    let turning=0, moving=0;
    if(keys[this.controls.left]) turning -= 1;
    if(keys[this.controls.right]) turning += 1;
    if(keys[this.controls.up]) moving += 1;
    if(keys[this.controls.down]) moving -= 1;

    this.angle += turning*this.turnSpeed;

    const nx = this.x + Math.cos(this.angle)*this.speed*moving;
    const ny = this.y + Math.sin(this.angle)*this.speed*moving;

    const box = this.rectBox(nx, ny);
    let blocked = false;
    if(nx-this.size/2<10 || nx+this.size/2>W-10 || ny-this.size/2<10 || ny+this.size/2>H-10) blocked=true;
    for(const w of walls){ if(rectsOverlap(box,w)){ blocked=true; break; } }
    const otherBox = other.rectBox();
    if(rectsOverlap(box, otherBox)) blocked = true;

    if(!blocked){ this.x = nx; this.y = ny; }

    if(keys[this.controls.fire] && this.cooldown<=0){
      bullets.push({
        x: this.x + Math.cos(this.angle)*this.size,
        y: this.y + Math.sin(this.angle)*this.size,
        dx: Math.cos(this.angle)*7,
        dy: Math.sin(this.angle)*7,
        owner: this,
        life: 90
      });
      this.cooldown = 22;
      sfx.fire();
    }
  }
  draw(){
    if(!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    // gölge
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 12;
    // gövde
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
    // namlu
    ctx.fillStyle = "#dfe6ee";
    ctx.fillRect(0, -3, this.size*0.9, 6);
    ctx.restore();
  }
}

const p1 = new Tank(80, H/2, "#5cd6ff", 0, {left:"KeyA", right:"KeyD", up:"KeyW", down:"KeyS", fire:"KeyF"});
const p2 = new Tank(W-80, H/2, "#ff6b6b", Math.PI, {left:"ArrowLeft", right:"ArrowRight", up:"ArrowUp", down:"ArrowDown", fire:"Enter"});

let bullets = [];
let gameOver = false;

function resetGame(){
  p1.x=80; p1.y=H/2; p1.angle=0; p1.hp=100; p1.alive=true; p1.cooldown=0;
  p2.x=W-80; p2.y=H/2; p2.angle=Math.PI; p2.hp=100; p2.alive=true; p2.cooldown=0;
  bullets = [];
  gameOver = false;
  document.getElementById('msg').style.display='none';
  document.getElementById('restart').style.display='none';
}

function drawWalls(){
  ctx.fillStyle = "#333c4d";
  ctx.strokeStyle = "#4a5468";
  for(const w of walls){
    ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.strokeRect(w.x,w.y,w.w,w.h);
  }
}

function updateBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.dx; b.y += b.dy; b.life--;

    let hitWall = false;
    for(const w of walls){
      if(b.x>w.x && b.x<w.x+w.w && b.y>w.y && b.y<w.y+w.h){ hitWall=true; break; }
    }
    if(b.x<10||b.x>W-10||b.y<10||b.y>H-10) hitWall=true;

    const target = b.owner===p1 ? p2 : p1;
    let hitTank = false;
    if(target.alive){
      const dx = b.x-target.x, dy=b.y-target.y;
      if(Math.sqrt(dx*dx+dy*dy) < target.size/2+3){
        hitTank = true;
        target.hp -= 12;
        if(target.hp<=0){ target.hp=0; target.alive=false; endGame(b.owner); }
      }
    }

    if(hitWall && !hitTank) sfx.wallHit();
    if(hitTank) sfx.tankHit();

    if(hitWall || hitTank || b.life<=0) bullets.splice(i,1);
  }
}

function drawBullets(){
  ctx.fillStyle = "#ffcf5c";
  ctx.shadowColor = "#ffcf5c";
  ctx.shadowBlur = 8;
  for(const b of bullets){
    ctx.beginPath();
    ctx.arc(b.x,b.y,3.5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function endGame(winner){
  gameOver = true;
  sfx.win();
  const msg = document.getElementById('msg');
  msg.style.color = winner===p1 ? "#5cd6ff" : "#ff6b6b";
  msg.textContent = (winner===p1 ? "OYUNCU 1" : "OYUNCU 2") + " KAZANDI!";
  msg.style.display = 'block';
  document.getElementById('restart').style.display = 'block';
}

function updateHUD(){
  document.getElementById('hp1').style.width = p1.hp+"%";
  document.getElementById('hp2').style.width = p2.hp+"%";
}

document.getElementById('restart').addEventListener('click', resetGame);

function loop(){
  ctx.clearRect(0,0,W,H);
  drawWalls();

  if(!gameOver){
    p1.update(bullets, p2);
    p2.update(bullets, p1);
    updateBullets();
  }

  p1.draw();
  p2.draw();
  drawBullets();
  updateHUD();

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
